name: Deploy Android to Play Console

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "closed"
        type: choice
        options:
          - closed
          - production

permissions:
  contents: read

jobs:
  deploy-closed:
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'closed')
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: com.avaling.bookbeam
      PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
      PLAY_RELEASE_STATUS: completed
      PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
      PLAY_VERSION_CODE_OFFSET: ${{ vars.PLAY_VERSION_CODE_OFFSET }}
      SUPPLY_JSON_KEY: fastlane/play-service-account.json
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode Google Play service account
        shell: bash
        run: |
          mkdir -p fastlane
          cat > "$SUPPLY_JSON_KEY" <<'JSON'
          ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          JSON

      - name: Decode Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      - name: Create Android signing properties
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verify signing files
        shell: bash
        run: |
          test -f android/app/release-keystore.jks
          test -f android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Compute Play version code
        shell: bash
        run: |
          BUILD_NUMBER="$(dart run tool/compute_play_version_code.dart)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Run tests
        run: flutter test

      - name: Run static analysis
        run: flutter analyze lib test

      - name: Build release app bundle
        run: flutter build appbundle --release --build-number "$BUILD_NUMBER"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: closed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Deploy to closed testing
        run: PLAY_TRACK="${PLAY_CLOSED_TRACK:-internal}" bundle exec fastlane android deploy_closed

  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production
    env:
      PACKAGE_NAME: com.avaling.bookbeam
      PLAY_RELEASE_STATUS: completed
      PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
      PLAY_VERSION_CODE_OFFSET: ${{ vars.PLAY_VERSION_CODE_OFFSET }}
      SUPPLY_JSON_KEY: fastlane/play-service-account.json
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode Google Play service account
        shell: bash
        run: |
          mkdir -p fastlane
          cat > "$SUPPLY_JSON_KEY" <<'JSON'
          ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          JSON

      - name: Decode Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      - name: Create Android signing properties
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verify signing files
        shell: bash
        run: |
          test -f android/app/release-keystore.jks
          test -f android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Compute Play version code
        shell: bash
        run: |
          BUILD_NUMBER="$(dart run tool/compute_play_version_code.dart)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Run tests
        run: flutter test

      - name: Run static analysis
        run: flutter analyze lib test

      - name: Build release app bundle
        run: flutter build appbundle --release --build-number "$BUILD_NUMBER"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Deploy to production
        run: bundle exec fastlane android deploy_production
